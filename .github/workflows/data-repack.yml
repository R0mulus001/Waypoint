name: Repack city data from earlier runs
# Publishes cities already built by earlier 'Build city data (many countries)' runs (their artifacts are kept 3 days),
# without building them again.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Run ids, comma separated"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pack and publish, one country at a time (the photos of all cities don't fit on the disk at once)
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        run: |
          for r in ${RUNS//,/ }; do
            ccs=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$r/artifacts?per_page=100" --jq '.artifacts[].name' | sed -n 's/^city-\([a-z]*\)-.*/\1/p' | sort -u)
            for cc in $ccs; do
              CC=$(echo "$cc" | tr a-z A-Z)
              rm -rf art out old dist; mkdir -p art out old
              gh run download "$r" -R "${{ github.repository }}" -p "city-$cc-*" -D art || { echo "::warning::$CC download failed"; continue; }
              for d in art/city-*; do [ -f "$d/city.json" ] && mv "$d" "out/${d#art/city-}"; done
              gh release download data -p index.json -p "$cc.json" -D old --clobber || true
              python pipeline/pack.py out dist "$CC" old/index.json "old/$cc.json" || { echo "::warning::packing $CC failed"; continue; }
              gh release upload data dist/* --clobber || echo "::warning::uploading $CC failed"
            done
          done
